name: Money Reel — Evening Publish

# Publishes whatever you approved during the day. Nothing else.
#
# This workflow never decides what goes out — it only carries out a decision
# already made on /studio/approve. If you approved nothing, it posts nothing and
# exits cleanly; that is a normal quiet day, not a failure.

on:
  # SCHEDULE OFF until the Instagram setup is done and one episode has been
  # published by hand. Turning it on before then would spend OpenAI and
  # ElevenLabs credits every morning building episodes with nowhere to go.
  #
  # To go live: uncomment the two lines below. That is the whole switch.
  #
  # Must match the generate schedule, or approved reels sit unpublished on the
  # days nothing runs. Mon/Wed/Fri — see money-reel-generate.yml for why.
  # schedule:
  #   # 13:30 UTC = 19:00 IST, Mon/Wed/Fri.
  #   - cron: '30 13 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would be posted without posting it'
        type: boolean
        required: false
        default: true

concurrency:
  group: money-reel-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rajneeti-backend/package-lock.json

      - name: Install dependencies
        working-directory: ./rajneeti-backend
        run: npm ci

      - name: Publish approved episodes
        working-directory: ./rajneeti-backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # This channel's own credentials. resolveChannel('money') throws if
          # they are absent rather than falling back to the Rajneeti account.
          IG_TOKEN__MONEY: ${{ secrets.IG_TOKEN__MONEY }}
          IG_USER_ID__MONEY: ${{ secrets.IG_USER_ID__MONEY }}
          FB_PAGE_TOKEN__MONEY: ${{ secrets.FB_PAGE_TOKEN__MONEY }}
        run: |
          set -euo pipefail
          # A manual run defaults to a dry run; the schedule publishes for real.
          # `inputs` is empty on a schedule trigger, so this must test for the
          # literal string 'true' — the mistake that silently disabled every
          # nightly publish in daily-reels.yml for weeks.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx src/publishMoneyEpisodes.ts --dry-run
          else
            npx tsx src/publishMoneyEpisodes.ts
          fi
